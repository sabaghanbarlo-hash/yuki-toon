name: Make toon video (test)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script file, e.g. scripts/chart-test.txt"
        default: "scripts/chart-test.txt"
      voice:
        description: "voicestudio (your cloned voice, slow: ~4 min per sentence) or babble (silent test sound, fast - checks the animation only)"
        default: "voicestudio"
      max_sentences:
        description: "Only voice/render the first N sentences (0 = whole script). Keep small for a test."
        default: "4"
      format:
        description: "long (16:9) or short (9:16)"
        default: "long"
      seed:
        description: "Different arrangement of the same script"
        default: "0"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SCRIPT: ${{ github.event.inputs.script }}
      VOICE: ${{ github.event.inputs.voice }}
      MAXS: ${{ github.event.inputs.max_sentences }}
      FORMAT: ${{ github.event.inputs.format }}
      SEED: ${{ github.event.inputs.seed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs
        run: |
          [[ "$SCRIPT" =~ ^scripts/[A-Za-z0-9._-]+\.txt$ ]] || { echo "::error::script must look like scripts/name.txt"; exit 1; }
          test -f "$SCRIPT" || { echo "::error::$SCRIPT not found"; exit 1; }
          [[ "$VOICE" == "voicestudio" || "$VOICE" == "babble" ]] || { echo "::error::voice must be voicestudio or babble"; exit 1; }
          [[ "$MAXS" =~ ^[0-9]{1,3}$ ]] || MAXS=4
          [[ "$FORMAT" == "long" || "$FORMAT" == "short" ]] || FORMAT=long
          [[ "$SEED" =~ ^[0-9]{1,6}$ ]] || SEED=0
          echo "MAXS=$MAXS" >> "$GITHUB_ENV"; echo "FORMAT=$FORMAT" >> "$GITHUB_ENV"; echo "SEED=$SEED" >> "$GITHUB_ENV"

      - name: Borrow icons, fonts and your voice sample (read-only copy from the main yuki-video repo)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/sabaghanbarlo-hash/yuki-video.git _main
          git -C _main sparse-checkout set assets voice
          cp -r _main/assets ./assets
          mkdir -p voice && cp _main/voice/ref.* voice/ 2>/dev/null || true
          cp -n _main/voice/match.json voice/ 2>/dev/null || true
          rm -rf _main
          ls assets voice

      - name: System dependencies
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y ffmpeg espeak-ng fontconfig libgl1 libegl1 libfontconfig1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Install Voice Studio (same pinned version as the main repo)
        if: ${{ github.event.inputs.voice == 'voicestudio' }}
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5.10.0" accelerate pydub soundfile numpy
          pip install --no-deps "git+https://github.com/debpalash/VoiceStudio.git@42f0f93b8f741c681861866b850add73501262ae"
          pip install pyworld || echo "pyworld not available"
          python -c "import omnivoice; from omnivoice import OmniVoice; print('Voice Studio engine ok')"

      - name: Cache Voice Studio model files
        if: ${{ github.event.inputs.voice == 'voicestudio' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-voicestudio-v1

      - name: Render
        run: |
          mkdir -p output
          name=$(basename "${SCRIPT%.txt}")
          EXTRA=""; [ "$MAXS" != "0" ] && EXTRA="--max-sentences $MAXS"
          if [ "$VOICE" = "voicestudio" ]; then
            src=$(ls voice/ref.* | grep -v '\.txt$' | head -1)
            ffmpeg -y -v error -i "$src" -t 20 -ar 24000 -ac 1 "$RUNNER_TEMP/ref.wav"
            python -u generate_toon.py "$SCRIPT" --tts voicestudio --ref "$RUNNER_TEMP/ref.wav" --format "$FORMAT" --seed "$SEED" $EXTRA --out "output/$name.mp4"
          else
            python -u generate_toon.py "$SCRIPT" --tts babble --format "$FORMAT" --seed "$SEED" $EXTRA --out "output/$name.mp4"
          fi
          ls -la output

      - name: Publish the video as a release (download it from the Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(basename "${SCRIPT%.txt}")
          tag="test-$(date +%Y%m%d-%H%M%S)"
          gh release create "$tag" "output/$name.mp4" --title "Test: $name ($VOICE)" --notes "Sandbox render. voice=$VOICE sentences=$MAXS format=$FORMAT seed=$SEED" --prerelease

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/*.mp4
